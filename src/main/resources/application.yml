server:
  port: 8081

quant:
  ai:
    api: ${QUANT_AI_API:http://quant-ai:8083}
  kafka:
    signal-topic: quant.signals.daily
  signal:
    top-n: ${SIGNAL_TOP_N:10}
  mongo:
    quant-data-uri: ${QUANT_DATA_MONGO_URI:mongodb://root:root@mongo6:27017/quant_data?authSource=admin}
  finnhub:
    # Live quotes for the holdings page. Unset is fine — QuoteService then serves the last
    # daily close from stock_prices_history instead of failing.
    token: ${FINNHUB_API_KEY:}

spring:
  application:
    name: quant-api
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://quant_keycloak:8080/realms/quant/protocol/openid-connect/certs"

  datasource:
    url: jdbc:mysql://mysql8:3306/workflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://root:root@mongodb:27017/quantdb?authSource=admin}
      database: quantdb

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: "true"
        spring.json.add.type.headers: "false"
    consumer:
      group-id: quant-signal-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the JSON one so a record that cannot be
      # deserialized reaches the error handler and is skipped. Without it the
      # container cannot commit past a bad record and re-reads the same offset
      # forever, pinning a full CPU core.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # The producer sets add.type.headers=false so non-Java consumers can read
        # the payload, so the target type has to be declared here instead.
        spring.json.use.type.headers: "false"
        spring.json.value.default.type: org.example.quantapi.event.DailySignalEvent
        spring.json.trusted.packages: "org.example.quantapi.event"
